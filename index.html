<!doctype html>
<html lang="no" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="no" />
    <title>Rørlager Hauge Maskin</title>
    <meta name="description" content="Skann QR-koden på hylla, velg rør og meter, og send inn uttaket." />
    <meta name="author" content="Hauge Maskin AS" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-title" content="Rørlager" />
    <meta name="application-name" content="Rørlager" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#171717" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rørlager Hauge Maskin" />
    <meta property="og:description" content="Skann, velg rør og meter, send inn." />
    <meta property="og:image" content="/icon-512.png" />
  </head>

  <body>
    <!-- Lastebiletet ligg INNE i #root med vilje: React byter ut innhaldet når
         appen er klar, så det treng ingen kode for å fjernast. -->
    <div id="root">
      <div class="hm-boot" role="status" aria-label="Laster">
        <img src="/splash-logo.png" alt="" width="320" height="320" />
        <div class="hm-boot-bar"><span></span></div>
      </div>
    </div>
    <style>
      .hm-boot {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
      }
      .hm-boot img {
        width: min(62vw, 320px);
        height: auto;
      }
      .hm-boot-bar {
        width: min(52vw, 220px);
        height: 4px;
        border-radius: 999px;
        background: #e6e6e6;
        overflow: hidden;
      }
      .hm-boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #d3121c;
        animation: hm-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes hm-boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hm-boot-bar span { animation: none; width: 100%; }
      }
      /* Utan dette blinkar det kvitt før React rekk å montere mørk drakt.
         Logofila har kvit botn, så ho får ei eiga avrunda plate å stå på. */
      @media (prefers-color-scheme: dark) {
        .hm-boot { background: #171717; }
        .hm-boot img { background: #fff; border-radius: 24px; }
        .hm-boot-bar { background: #333333; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
